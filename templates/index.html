<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karty Przeciwko Ludzkości - Klon</title>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- Socket.IO -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.js"></script>
    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
    <!-- Background Animation Layer -->
    <div id="bg-animation"></div>

    <!-- Ekran logowania -->
    <div id="login-screen">
        <div class="login-container">
            <h1>DOŁĄCZ DO GRY</h1>
            <input type="text" id="nickname" placeholder="Twój Nick" maxlength="15">
            <input type="password" id="password" placeholder="Hasło Sesji">
            <button id="join-btn">WEJDŹ</button>
            <p id="login-error" class="error-msg"></p>
        </div>
    </div>

    <!-- Obszar gry -->
    <div id="game-area" class="hidden">
        <div class="game-header">
            <div class="status-panel">
                <h2 id="game-status">Oczekiwanie...</h2>
                <div id="czar-display">Car: <span id="czar-name">-</span></div>
                <button id="settings-btn" class="hidden">⚙️ Ustawienia</button>
            </div>

            <div id="timer-display" class="hidden">60</div>

            <!-- Host Controls -->
            <div id="host-controls" class="hidden" style="display: flex; gap: 0.5rem;">
                <button id="pause-btn" class="control-btn" title="Pauza/Wznów">⏸</button>
                <button id="stop-btn" class="control-btn" title="Zakończ grę">⏹</button>
            </div>

            <button id="start-btn" class="hidden">ROZPOCZNIJ GRĘ</button>
        </div>

        <div class="game-main">
            <!-- Stół z kartami -->
            <div id="table-area">
                <div id="black-card-container">
                    <!-- Tu trafi czarna karta -->
                </div>
                <div id="played-cards-container">
                    <!-- Tu trafią zagrane białe karty -->
                </div>
            </div>

            <!-- Lista graczy / Wyniki -->
            <div id="sidebar">
                <h3>TABELA WYNIKÓW</h3>
                <ul id="players-list">
                    <!-- Lista dynamiczna -->
                </ul>
            </div>
        </div>

        <!-- Ręka gracza -->
        <div id="hand-section">
            <div id="hand-controls-bar" style="position: absolute; top: -40px; width: 100%; display: flex; justify-content: center; gap: 1rem; pointer-events: none;">
                <div id="selection-controls" class="hidden" style="pointer-events: auto;">
                    <span>Wybrano: <span id="selected-count">0</span>/<span id="required-count">1</span></span>
                    <button id="confirm-play-btn" disabled>ZAGRAJ</button>
                </div>
                <button id="reroll-btn" class="control-btn hidden" style="pointer-events: auto; font-size: 0.9rem;">Wymień rękę (3/3)</button>
            </div>
            <div id="hand-container">
                <!-- Karty gracza -->
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h1>Ustawienia Gry</h1>

            <div class="setting-item">
                <label>Głośność: <span id="volume-val">50%</span></label>
                <input type="range" id="volume-slider" min="0" max="100" value="50">
            </div>

            <hr style="border: 0; border-top: 1px solid #333; margin: 1rem 0;">

            <div class="setting-item">
                <label>Punkty do zwycięstwa:</label>
                <input type="number" id="set-max-score" min="1" max="20" value="8">
            </div>
            <div class="setting-item">
                <label>Czas na rundę (s):</label>
                <input type="number" id="set-timer" min="10" max="300" value="60">
            </div>
            <div class="setting-item">
                <label>Liczba pustych kart:</label>
                <input type="number" id="set-blank-cards" min="0" max="10" value="0">
            </div>

            <div class="stats-info" style="margin-top: 1rem; font-size: 0.8rem; color: #888;">
                <p>Czarne karty: <span id="stat-black-count">-</span></p>
                <p>Białe karty: <span id="stat-white-count">-</span></p>
            </div>

            <div class="modal-buttons">
                <button class="modal-btn" id="save-settings-btn">ZAPISZ</button>
                <button class="modal-btn" id="close-settings-btn" style="background: #333;">ANULUJ</button>
            </div>
        </div>
    </div>

    <!-- Blank Card Input Modal -->
    <div id="blank-card-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h1>Wypełnij pustą kartę</h1>
            <textarea id="blank-card-input" placeholder="Wpisz coś zabawnego..." rows="4" style="width: 100%; margin: 1rem 0; padding: 0.5rem; background: #222; color: #fff; border: 1px solid #444; font-size: 1.2rem;"></textarea>
            <div class="modal-buttons">
                <button class="modal-btn" id="confirm-blank-btn">ZATWIERDŹ</button>
                <button class="modal-btn" id="cancel-blank-btn" style="background: #333;">ANULUJ</button>
            </div>
        </div>
    </div>

    <!-- Pause Overlay -->
    <div id="pause-overlay" class="modal-overlay hidden" style="background: rgba(0,0,0,0.5); backdrop-filter: blur(5px);">
        <div style="text-align: center;">
            <h1 style="font-size: 4rem; text-shadow: 0 0 20px black;">PAUZA</h1>
            <p>Oczekiwanie na wznowienie gry...</p>
        </div>
    </div>

    <!-- Powiadomienia -->
    <div id="toast-container"></div>

    <script src="/static/js/sound.js"></script>
    <script src="/static/js/background.js"></script>
    <script src="/static/js/game.js"></script>
</body>
</html>
